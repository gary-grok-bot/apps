/* ---------- v3.1 polish (Design Lead audit 2026-10-11) ---------- */
/* one interaction model: hover = sand/copper border (140ms), press = 1px down, focus = 2px copper ring. */
.btn,.chip,a.lcard,a.card,.ds-sw-lab,details>summary,.ds-brand{-webkit-tap-highlight-color:transparent}
.btn:active,.chip:active,a.lcard:active,.ds-sw-lab:active{transform:translateY(1px);transition-duration:60ms}

.ds-sw-lab{transition:border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}

.btn:focus-visible,.chip:focus-visible,a.lcard:focus-visible,a.card:focus-visible,details>summary:focus-visible,.ds-brand:focus-visible{outline:2px solid var(--cu2);outline-offset:2px;border-radius:var(--radius-s)}

li>a:not([class]),td>a:not([class]){display:inline-block;padding-block:12px;margin-block:-12px}

.ds-state{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s5) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);max-width:var(--measure)}
.ds-state svg{flex:none;color:var(--faint);margin-top:2px}
.ds-state b{display:block;color:var(--sand);font-weight:600;font-size:var(--fs-body)}
.ds-state p{margin:var(--s1) 0 0;font-size:var(--fs-small)}
.ds-state .btn{margin-top:var(--s3)}

[hidden]{display:none!important}
