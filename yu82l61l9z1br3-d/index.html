                margin-bottom: 1em;

.pcs li{margin:0;display:flex;min-width:0}
.pc{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s2);min-height:var(--tap);padding:var(--s4) var(--s5) var(--s3);
  background:var(--ch);border:1px solid transparent;border-radius:var(--radius);color:var(--sand);text-decoration:none;
  transition:transform var(--t) var(--ease),border-color var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease)}
a.pc:hover{transform:translateY(-2px);border-color:var(--cu-underline);background:var(--ch2);color:var(--sand)}
a.pc:active{transform:translateY(0);transition-duration:var(--t-fast)}
a.pc:focus-visible{outline:2px solid var(--cu2);outline-offset:3px}
.pc-title{font-size:var(--fs-h3);font-weight:600;letter-spacing:-.01em}
.pc-line{font-size:var(--fs-small);color:var(--muted);line-height:1.45}
.pc-nums{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin-top:var(--s2)}
.pc-num{display:flex;flex-direction:column;min-width:0}
.pc-num b{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.pc-num small{font-size:var(--fs-meta);color:var(--faint)}
.pc-meta{margin-top:auto;padding-top:var(--s3);display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-meta);color:var(--faint);font-variant-numeric:tabular-nums}

a.pc:hover .pc-go{transform:translateX(3px);color:var(--cu2)}
.pc.is-soon{border-style:dashed;background:var(--g)}

.h4-lead{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:var(--s7);align-items:start;margin:0 0 var(--s7)}
.h4-lead>.ag,.h4-lead>.h4-sec{margin:0}
.h4-lead .pcs{grid-template-columns:minmax(0,1fr)}

.h4-ops{margin-top:var(--s8);padding-top:var(--s5);border-top:1px solid var(--rule)}
.h4-ops .sec-title{margin-top:0}
.h4-ops .sec-title h2{font-size:var(--fs-h3);color:var(--muted)}

@media (prefers-reduced-motion:no-preference){
  .hub4{animation:h4-in 300ms var(--ease) both}
  @keyframes h4-in{from{opacity:0}to{opacity:1}}
}
@media (prefers-reduced-motion:reduce){.ag-item,.pc,.pc-go{transition:none}a.pc:hover,a.pc:hover .pc-go{transform:none}}

@media (max-width:640px){
  .h4-lead{grid-template-columns:minmax(0,1fr);gap:var(--s6)}
  .h4-top{padding:var(--s3) 0 var(--s4)}
  .ag-col{grid-template-columns:minmax(0,1fr);gap:var(--s1);padding:var(--s3) 0}
  .ag-col.is-quiet{grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:var(--s3);padding:6px 0}
  .ag-col.is-quiet .ag-day{min-height:0;padding:0}
  .ag-col.is-quiet .ag-none{padding:0}
  .ag-item{margin:0 calc(-1 * var(--s2));padding:var(--s2);grid-template-columns:auto minmax(0,1fr);column-gap:var(--s2)}
  .ag-what{grid-column:1/-1}
  .ag-time{grid-column:1;grid-row:2;font-size:var(--fs-meta);margin-top:2px}
  .ag-meta{grid-column:2;grid-row:2}
  .ag-tag{grid-column:1/-1;grid-row:3;justify-self:start}
  .pc{padding:var(--s4)}
}

.ag-facts{display:block;font-size:var(--fs-meta);color:var(--muted);margin-top:2px}.ag-facts b{font-weight:600;color:var(--ss)}.ag-facts a{color:var(--cu2)}

.ag-disc{display:none}
@media (max-width:820px){

  .ag-disc::after{content:" ▾"}.ag-col.is-open .ag-disc::after{content:" ▴"}

.tl-list li:first-child{border-top:1px solid var(--rule)}
