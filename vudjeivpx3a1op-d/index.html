                margin: 0 0 15px;
                box-sizing: border-box;
            }

                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;

                outline: 0;
                background: #E04E2A;

                color: #ffffff;

                height: 100%;

                -moz-osx-font-smoothing: grayscale;

                margin-top: -1em;
                margin-bottom: 1em;
            }

                font-size: 1.5em;

                display: flex;
                align-items: center;
                margin-bottom: 1em;
