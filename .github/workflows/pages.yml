name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: hour
        run: echo "h=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .git
          key: apps-git-${{ steps.hour.outputs.h }}
          restore-keys: apps-git-
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
      - if: ${{ vars.LIVE_HOST != '' }}
        env:
          LIVE_HOST: ${{ vars.LIVE_HOST }}
        run: python3 .github/redirect.py
      - run: tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          reporting_interval: 1000
